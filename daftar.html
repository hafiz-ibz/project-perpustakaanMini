<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan-daftar</title>
    <link rel="stylesheet" href="daftar.css">
</head>

<body>

    <div class="gmbr1" id="gambar-atas">
        <img src="assets/bukubuka.png" alt="">
    </div>

    <div class="gmbr2" id="gambar-bawah">
        <img src="assets/bukubukabawah.png" alt="">
    </div>

    <h1 id="judul-halaman">Wujudkan mimpi anak RPL hebat</h1>

    <div class="kotak" id="form-daftar">

        <h1 id="judul-daftar">Selamat Datang!</h1>

        <p class="judul" id="subjudul-daftar">
            Daftar untuk membuat akun perpustakaan
        </p>

        <input
            type="text"
            id="input-username"
            placeholder="Masukkan username"
        >

        <input
            type="email"
            id="input-email"
            placeholder="Masukkan email"
        >

        <input
            type="password"
            id="input-password"
            placeholder="Masukkan password"
        >

        <input
            type="password"
            id="input-konfirmasi-password"
            placeholder="Konfirmasi password"
        >

        <button
            type="button"
            class="btn-daftar"
            id="btn-daftar"
            onclick="window.location.href='dashboard.html'"
        >
            Daftar
        </button>

        <div class="daftar" id="link-masuk">

            <p>Sudah Punya Akun?</p>

            <a href="login.html" id="btn-masuk">
                Masuk
            </a>

        </div>

    </div>

</body>
</html>
