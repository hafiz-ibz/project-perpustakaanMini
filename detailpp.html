<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perpustakaan - Pengaturan Profile</title>

    <link rel="stylesheet" href="detailpp.css">
</head>

<body>

    <div class="dashboard" id="dashboard">

        <div class="sidebar" id="sidebar">

            <div class="logo" id="logo-library">

                <img src="assets/buku.png" alt="">

                <span>RPL 4 LIBRARY</span>

            </div>

            <div class="menu" id="menu-sidebar">

                <a href="" id="menu-beranda">
                    <img src="assets/home.png" alt="">
                    <span>Beranda</span>
                </a>

                <a href="" id="menu-buku">
                    <img src="assets/book.png" alt="">
                    <span>Buku</span>
                </a>

                <a href="" id="menu-peminjaman">
                    <img src="assets/bawa buku.png" alt="">
                    <span>Peminjaman</span>
                </a>

                <a href="" id="menu-riwayat">
                    <img src="assets/history.png" alt="">
                    <span>Riwayat</span>
                </a>

                <a href="" id="menu-notifikasi">
                    <img src="assets/notif.png" alt="">
                    <span>Notifikasi</span>
                </a>

                <a href="" class="menu-aktif" id="menu-profile">
                    <img src="assets/pp.png" alt="">
                    <span>Profile</span>
                </a>

                <a href="" id="menu-pengaturan">
                    <img src="assets/seting.png" alt="">
                    <span>Pengaturan</span>
                </a>

            </div>

            <a href="" class="logout" id="btn-logout">

                <span>↪</span>

                <span>Logout</span>

            </a>

        </div>

        <div class="content" id="content-profile">

            <div class="profile-title" id="profile-title">

                <h1>Profile</h1>

            </div>

            <div class="title-line" id="title-line">

                <div class="blue-line" id="blue-line"></div>

            </div>

            <div class="profile-content" id="profile-content">

                <div class="account-section" id="account-section">

                    <h2>Informasi Akun</h2>

                    <div class="form-group" id="form-nama">

                        <label for="nama">
                            Nama Lengkap
                        </label>

                        <input
                            type="text"
                            id="nama"
                            value="Muhammad Rafli"
                        >

                    </div>

                    <div class="form-group" id="form-telpon">

                        <label for="telpon">
                            No Telpon
                        </label>

                        <input
                            type="text"
                            id="telpon"
                            value="081929381029"
                        >

                    </div>

                    <div class="form-group" id="form-email">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            value="raflikelasrpl4@gmail.com"
                        >

                    </div>

                    <button
                        class="simpan"
                        id="simpanPerubahan"
                    >
                        Simpan Perubahan
                    </button>

                </div>

                <div class="foto-section" id="foto-section">

                    <h2>
                        Foto profile
                    </h2>

                    <div class="foto-profile" id="foto-profile">

                        <img
                            src="assets/profil.png"
                            alt="Foto Profile"
                        >

                    </div>

                    <button
                        class="edit-profile"
                        id="editProfile"
                    >
                        Edit Profile
                    </button>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
